services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./6a869ec7afcf0c13b01acc85:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:5173"

volumes:
  web_node_modules:
