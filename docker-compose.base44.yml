services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "3000:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
